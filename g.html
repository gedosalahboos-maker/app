<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر إعلان سريع - سوق الهواتف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { font-family: 'Cairo', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .input-animate {
            transition: all 0.3s ease;
        }
        .input-animate:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(102, 126, 234, 0.5);
        }
        .preview-img {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .preview-img:hover {
            transform: scale(1.05) rotate(2deg);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.6s ease forwards;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md animate-slide-up">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                <i class="fas fa-mobile-alt text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">نشر إعلان</h1>
            <p class="text-white/70">أدخل بيانات الهاتف في 3 خطوات سريعة</p>
        </div>

        <!-- Form Card -->
        <div class="glass rounded-3xl p-8 shadow-2xl">
            <form id="adForm" onsubmit="publishAd(event)">
                
                <!-- 1. اسم الهاتف -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fas fa-tag text-indigo-500 ml-2"></i>
                        اسم الهاتف
                    </label>
                    <input 
                        type="text" 
                        id="phoneName"
                        placeholder="مثال: iPhone 15 Pro Max"
                        class="input-animate w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:outline-none focus:border-indigo-500 text-lg font-semibold"
                        required
                    >
                </div>

                <!-- 2. رقم الهاتف -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fas fa-phone text-green-500 ml-2"></i>
                        رقم التواصل
                    </label>
                    <div class="relative">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">+249</span>
                        <input 
                            type="tel" 
                            id="phoneNumber"
                            placeholder="912345678"
                            class="input-animate w-full pr-20 pl-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:outline-none focus:border-indigo-500 text-lg text-left"
                            maxlength="9"
                            required
                        >
                    </div>
                </div>

                <!-- 3. صورة الهاتف -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fas fa-camera text-purple-500 ml-2"></i>
                        صورة الهاتف
                    </label>
                    
                    <div 
                        id="dropZone"
                        class="border-3 border-dashed border-gray-300 rounded-2xl p-6 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/50 transition-all group"
                        onclick="document.getElementById('imageInput').click()"
                    >
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImage(this)">
                        
                        <div id="uploadPlaceholder">
                            <div class="w-14 h-14 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                                <i class="fas fa-cloud-upload-alt text-indigo-600 text-xl"></i>
                            </div>
                            <p class="text-gray-500 font-medium">اضغط لاختيار صورة</p>
                            <p class="text-gray-400 text-xs mt-1">JPG, PNG - حتى 5MB</p>
                        </div>
                        
                        <img id="imagePreview" class="preview-img hidden w-full h-48 object-cover rounded-xl mx-auto" />
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full gradient-bg text-white py-4 rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all flex items-center justify-center gap-2"
                >
                    <span>نشر الإعلان</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="successMsg" class="hidden mt-6 glass rounded-2xl p-6 text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fas fa-check text-green-600 text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-1">تم النشر بنجاح!</h3>
            <p class="text-gray-500 text-sm">سيتم تحويلك لصفحة الإعلانات...</p>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
            authDomain: "phone-soug.firebaseapp.com",
            projectId: "phone-soug",
            storageBucket: "phone-soug.firebasestorage.app",
            messagingSenderId: "224588578227",
            appId: "1:224588578227:web:46b4cb96ff2535a1521fc6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>

    <script>
        let selectedImage = null;
        let imageBase64 = null;

        function handleImage(input) {
            const file = input.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('الصورة كبيرة جداً! الحد الأقصى 5MB');
                return;
            }

            selectedImage = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                imageBase64 = e.target.result;
                const preview = document.getElementById('imagePreview');
                const placeholder = document.getElementById('uploadPlaceholder');
                
                preview.src = imageBase64;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function publishAd(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;
            
            // التحقق من الصورة
            if (!imageBase64) {
                alert('الرجاء اختيار صورة للهاتف');
                return;
            }

            // Loading state
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            try {
                const adData = {
                    // نفس مفاتيح قاعدة البيانات الأصلية
                    phoneModel: document.getElementById('phoneName').value,
                    contactPhone: '+249' + document.getElementById('phoneNumber').value,
                    mainImage: imageBase64,
                    
                    // بيانات إضافية مطلوبة
                    brand: 'unknown',
                    price: 0,
                    status: 'used',
                    state: 'khartoum',
                    city: 'الخرطوم',
                    neighborhood: 'غير محدد',
                    whatsApp: '+249' + document.getElementById('phoneNumber').value,
                    contactMethods: ['whatsapp'],
                    
                    // معلومات النظام
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    isActive: true,
                    isSold: false,
                    views: 0
                };

                // حفظ في Firestore
                const docRef = await window.addDoc(window.collection(window.db, 'ads'), adData);
                console.log('✅ تم النشر:', docRef.id);

                // عرض رسالة النجاح
                document.getElementById('adForm').classList.add('hidden');
                document.getElementById('successMsg').classList.remove('hidden');
                
                // تحويل بعد 2 ثانية
                setTimeout(() => {
                    window.location.href = 'ads.html';
                }, 2000);

            } catch (error) {
                console.error('❌ خطأ:', error);
                alert('حدث خطأ: ' + error.message);
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
