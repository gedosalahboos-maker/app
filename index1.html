<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سوق فون - Sudan Phone Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { 
            font-family: 'Cairo', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background: #F0F2F5; 
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* ====== HEADER ====== */
        .header {
            padding: 12px 16px 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .profile-img {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .profile-label {
            font-size: 10px;
            font-weight: 600;
            color: #666;
            margin-top: 2px;
        }
        .header-icons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .icon-btn {
            position: relative;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .icon-heart { color: #FF4757; }
        .icon-bell { color: #555; font-size: 22px; }
        .icon-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #1E90FF;
            color: white;
            font-size: 10px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #F0F2F5;
        }
        .header-text {
            text-align: right;
            margin-top: 4px;
        }
        .header-text h1 {
            font-size: 16px;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1.3;
        }
        .header-text p {
            font-size: 12px;
            color: #888;
            font-weight: 500;
            margin-top: 2px;
        }
        .header-logo {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        /* ====== SEARCH ====== */
        .search-bar {
            padding: 8px 16px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .filter-btn {
            background: #1E90FF;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(30,144,255,0.25);
        }
        .search-input-wrapper {
            flex: 1;
            background: white;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #eee;
        }
        .search-input-wrapper input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            background: transparent;
            text-align: right;
        }
        .search-input-wrapper input::placeholder { color: #bbb; font-weight: 500; }
        .search-input-wrapper i { color: #bbb; font-size: 16px; }

        /* ====== BANNER ====== */
        .banner-section {
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .banner-card {
            background: linear-gradient(135deg, #E8F4FD 0%, #F5F0FF 50%, #FFF8F0 100%);
            border-radius: 20px;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            min-height: 170px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .banner-left-decor {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            overflow: hidden;
        }
        .banner-left-decor::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 20px;
            width: 80px;
            height: 120px;
            background: linear-gradient(180deg, #FFB347 0%, #FFCC33 100%);
            border-radius: 0 40px 40px 0;
            opacity: 0.3;
            transform: rotate(-15deg);
        }
        .banner-content {
            flex: 1;
            z-index: 2;
            text-align: right;
            padding-left: 10px;
        }
        .banner-title {
            font-size: 19px;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .banner-subtitle {
            font-size: 13px;
            color: #666;
            font-weight: 500;
            line-height: 1.6;
        }
        .banner-images {
            display: flex;
            align-items: center;
            gap: -10px;
            z-index: 2;
            position: relative;
        }
        .banner-img {
            width: 90px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
        }
        .banner-img:nth-child(2) {
            margin-right: -20px;
            margin-left: -20px;
            z-index: 3;
            transform: scale(1.1);
        }
        .banner-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
        }
        .banner-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s;
            cursor: pointer;
        }
        .banner-dot.active {
            width: 24px;
            border-radius: 4px;
            background: #1E90FF;
        }

        /* ====== SECTION HEADER ====== */
        .section-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 900;
            color: #1a1a1a;
        }
        .view-all-link {
            font-size: 14px;
            font-weight: 800;
            color: #1E90FF;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ====== PHONE CARDS GRID ====== */
        .phones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
        }
        .phone-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
            transition: all 0.3s ease;
        }
        .phone-card:active { transform: scale(0.97); }
        .phone-card-img {
            width: 100%;
            height: 170px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
        }
        .phone-card-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .phone-card-body {
            padding: 12px 14px 14px;
        }
        .phone-card-title {
            font-size: 14px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 12px;
            line-height: 1.4;
            min-height: 40px;
        }
        .phone-card-specs {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .spec-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }
        .spec-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #555;
        }
        .spec-icon svg {
            width: 22px;
            height: 22px;
            stroke: #555;
            fill: none;
            stroke-width: 1.8;
        }
        .spec-text {
            font-size: 10px;
            font-weight: 700;
            color: #666;
            line-height: 1.3;
        }
        .phone-card-price {
            font-size: 16px;
            font-weight: 900;
            color: #1a1a1a;
            text-align: center;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }
        .phone-card-price span {
            font-size: 13px;
            font-weight: 800;
        }

        /* ====== BOTTOM NAV ====== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            z-index: 50;
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 6px 0 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
        }
        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            padding: 0 8px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 8px;
            color: #888;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active {
            color: #1a1a1a;
        }
        .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .fab-wrapper {
            position: relative;
            top: -24px;
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .fab-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFB347 0%, #FFCC33 100%);
            color: white;
            border: 4px solid #F0F2F5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.4);
            transition: all 0.3s ease;
        }
        .fab-btn:hover { transform: scale(1.1); }
        .fab-btn:active { transform: scale(0.95); }

        /* ====== MODAL ====== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: block; opacity: 1; }

        .modal-sheet {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: white;
            border-radius: 24px 24px 0 0;
            z-index: 70;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-sheet.active {
            transform: translateY(0);
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 12px auto;
        }
        .modal-img-area {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .modal-img-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .close-modal-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #333;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .modal-info {
            padding: 20px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .modal-price {
            font-size: 24px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        .modal-price span {
            font-size: 14px;
            font-weight: 800;
        }
        .modal-specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .modal-spec-item {
            background: #f8f9fa;
            padding: 12px 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }
        .modal-spec-item svg {
            width: 24px;
            height: 24px;
            stroke: #555;
            fill: none;
            stroke-width: 1.8;
        }
        .modal-spec-item i {
            font-size: 20px;
            color: #555;
        }
        .modal-spec-label {
            font-size: 10px;
            color: #888;
            font-weight: 500;
        }
        .modal-spec-value {
            font-size: 13px;
            font-weight: 800;
            color: #1a1a1a;
        }
        .contact-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .contact-btn:active { transform: scale(0.98); }
        .btn-whatsapp {
            background: #25D366;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .btn-call {
            background: #1E90FF;
            color: white;
            box-shadow: 0 4px 12px rgba(30, 144, 255, 0.3);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* Admin Banner Images - 4 slots */
        .admin-banner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .admin-banner-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            background: #e0e0e0;
        }
    </style>
<base target="_blank">
</head>
<body>

    <!-- ====== HEADER ====== -->
    <div class="header">
        <div class="header-left">
            <div class="profile-section">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face" 
                     alt="حسابي" class="profile-img" onclick="showProfile()">
                <span class="profile-label">حسابي</span>
            </div>
            <div class="header-icons">
                <div class="icon-btn icon-heart" onclick="showFavorites()">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="icon-btn" onclick="showNotifications()">
                    <i class="fas fa-bell icon-bell"></i>
                    <span class="icon-badge">1</span>
                </div>
            </div>
        </div>
        <div class="header-text">
            <h1>أهلاً بك، سليمان...</h1>
            <p>مرحباً بك في سوق فون</p>
        </div>
        <div class="header-logo">
            <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="12" y="6" width="26" height="38" rx="5" fill="#FFB347" stroke="#FFCC33" stroke-width="2"/>
                <rect x="16" y="10" width="18" height="26" rx="3" fill="white"/>
                <circle cx="25" cy="38" r="2" fill="#333"/>
                <rect x="20" y="4" width="10" height="4" rx="2" fill="#FFCC33"/>
                <path d="M38 12 L44 8 L44 20 L38 16 Z" fill="#FFCC33" opacity="0.6"/>
                <rect x="42" y="10" width="4" height="12" rx="1" fill="#FFCC33" opacity="0.4"/>
            </svg>
        </div>
    </div>

    <!-- ====== SEARCH ====== -->
    <div class="search-bar">
        <button class="filter-btn" onclick="showFilters()">
            <i class="fas fa-sliders-h"></i>
            فلترة
        </button>
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="ابحث عن هاتفك..." oninput="filterPhones()">
            <i class="fas fa-search"></i>
        </div>
    </div>

    <!-- ====== BANNER SLIDER ====== -->
    <div class="banner-section animate-in delay-1">
        <div class="banner-card" id="bannerCard">
            <div class="banner-left-decor"></div>
            <div class="banner-images" id="bannerImages">
                <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=200&h=300&fit=crop" 
                     class="banner-img" alt="Phone 1" id="bannerImg1">
                <img src="https://images.unsplash.com/photo-1696446701796-da61225697cc?w=200&h=300&fit=crop" 
                     class="banner-img" alt="Phone 2" id="bannerImg2" style="display:none;">
                <img src="https://images.unsplash.com/photo-1610945265078-3858a0b5d8f4?w=200&h=300&fit=crop" 
                     class="banner-img" alt="Phone 3" id="bannerImg3" style="display:none;">
                <img src="https://images.unsplash.com/photo-1678652197831-2d180705cd2c?w=200&h=300&fit=crop" 
                     class="banner-img" alt="Phone 4" id="bannerImg4" style="display:none;">
            </div>
            <div class="banner-content">
                <div class="banner-title" id="bannerTitle">أحدث الهواتف الذكية<br>بأسعار منافسة!</div>
                <div class="banner-subtitle" id="bannerSubtitle">اكشف عن عروضنا الحصرية<br>للهواتف الذكية</div>
            </div>
        </div>
        <div class="banner-dots">
            <div class="banner-dot active" onclick="setBanner(0)"></div>
            <div class="banner-dot" onclick="setBanner(1)"></div>
            <div class="banner-dot" onclick="setBanner(2)"></div>
        </div>
    </div>

    <!-- ====== SECTION HEADER ====== -->
    <div class="section-row animate-in delay-2">
        <div class="section-title">أحدث عروض الهواتف</div>
        <div class="view-all-link" onclick="showAllPhones()">
            عرض الكل
            <i class="fas fa-chevron-left" style="font-size: 10px;"></i>
        </div>
    </div>

    <!-- ====== PHONES GRID ====== -->
    <div class="phones-grid animate-in delay-3" id="phonesContainer">
        <!-- Cards rendered by JS -->
    </div>

    <!-- ====== BOTTOM NAV ====== -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <div class="nav-item active" onclick="setNav(this, 'home')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>الرئيسية</span>
            </div>
            <div class="nav-item" onclick="setNav(this, 'stores')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>المتاجر</span>
            </div>
            <div class="fab-wrapper">
                <button class="fab-btn" onclick="addAd()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="nav-item" onclick="setNav(this, 'chats')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <span>المحادثات</span>
            </div>
            <div class="nav-item" onclick="setNav(this, 'list')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                <span>قائمتي</span>
            </div>
        </div>
    </nav>

    <!-- ====== MODAL ====== -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="modal-sheet" id="phoneModal">
        <div class="modal-handle"></div>
        <button class="close-modal-btn" onclick="closeModal()">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-img-area" id="modalImg">
            <img src="" alt="Phone">
        </div>
        <div class="modal-info">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-price" id="modalPrice"></div>
            <div class="modal-specs-grid" id="modalSpecs"></div>
            <button class="contact-btn btn-whatsapp" id="modalWhatsApp" onclick="contactWhatsApp()">
                <i class="fab fa-whatsapp"></i>
                تواصل عبر واتساب
            </button>
            <button class="contact-btn btn-call" id="modalCall" onclick="contactCall()">
                <i class="fas fa-phone"></i>
                اتصل الآن
            </button>
        </div>
    </div>

    <!-- Firebase + JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
            authDomain: "phone-soug.firebaseapp.com",
            databaseURL: "https://phone-soug-default-rtdb.firebaseio.com",
            projectId: "phone-soug",
            storageBucket: "phone-soug.firebasestorage.app",
            messagingSenderId: "224588578227",
            appId: "1:224588578227:web:f3127dfbea31a77d521fc6",
            measurementId: "G-S87955B526"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPhones = [];
        let currentPhone = null;
        let currentBanner = 0;

        // Banner data with 4 image slots for admin
        const banners = [
            {
                title: "أحدث الهواتف الذكية\nبأسعار منافسة!",
                subtitle: "اكشف عن عروضنا الحصرية\nللهواتف الذكية",
                img1: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=200&h=300&fit=crop",
                img2: "",
                img3: "",
                img4: ""
            },
            {
                title: "عروض حصرية\nعلى سامسونج!",
                subtitle: "خصومات تصل إلى 30%\nعلى أحدث الموديلات",
                img1: "https://images.unsplash.com/photo-1610945265078-3858a0b5d8f4?w=200&h=300&fit=crop",
                img2: "",
                img3: "",
                img4: ""
            },
            {
                title: "آيفون 15 برو\nمتاح الآن!",
                subtitle: "احصل على أحدث آيفون\nبأفضل سعر في السودان",
                img1: "https://images.unsplash.com/photo-1678652197831-2d180705cd2c?w=200&h=300&fit=crop",
                img2: "",
                img3: "",
                img4: ""
            }
        ];

        // Banner rotation
        setInterval(() => {
            currentBanner = (currentBanner + 1) % banners.length;
            updateBanner();
        }, 4000);

        window.setBanner = function(index) {
            currentBanner = index;
            updateBanner();
        };

        function updateBanner() {
            const banner = banners[currentBanner];
            document.getElementById('bannerTitle').innerHTML = banner.title.replace(/\n/g, '<br>');
            document.getElementById('bannerSubtitle').innerHTML = banner.subtitle.replace(/\n/g, '<br>');

            // Update 4 image slots
            const img1 = document.getElementById('bannerImg1');
            const img2 = document.getElementById('bannerImg2');
            const img3 = document.getElementById('bannerImg3');
            const img4 = document.getElementById('bannerImg4');

            if (banner.img1) { img1.src = banner.img1; img1.style.display = 'block'; } else { img1.style.display = 'none'; }
            if (banner.img2) { img2.src = banner.img2; img2.style.display = 'block'; } else { img2.style.display = 'none'; }
            if (banner.img3) { img3.src = banner.img3; img3.style.display = 'block'; } else { img3.style.display = 'none'; }
            if (banner.img4) { img4.src = banner.img4; img4.style.display = 'block'; } else { img4.style.display = 'none'; }

            document.querySelectorAll('.banner-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentBanner);
            });
        }

        // Load phones from Firebase
        async function loadPhones() {
            try {
                const phonesQuery = query(collection(db, 'ads'), orderBy('createdAt', 'desc'), limit(20));
                onSnapshot(phonesQuery, (snapshot) => {
                    allPhones = [];
                    snapshot.forEach((doc) => { allPhones.push({ id: doc.id, ...doc.data() }); });
                    renderPhones(allPhones);
                }, (error) => { fallbackLoad(); });
            } catch (error) { fallbackLoad(); }
        }

        async function fallbackLoad() {
            try {
                const q = query(collection(db, 'ads'), limit(20));
                const snapshot = await getDocs(q);
                allPhones = [];
                snapshot.forEach((doc) => { allPhones.push({ id: doc.id, ...doc.data() }); });
                renderPhones(allPhones);
            } catch (err) { renderPhones(getDemoPhones()); }
        }

        function getDemoPhones() {
            return [
                {
                    id: '1',
                    phoneModel: 'آيفون 15 برو ماكس\n2024',
                    price: 1800000,
                    storage: 256,
                    ram: 8,
                    status: 'new',
                    brand: 'Apple',
                    mainImage: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400&h=400&fit=crop',
                    userName: 'متجر التقنية',
                    city: 'الخرطوم',
                    contactPhone: '+249912345678',
                    whatsApp: '+249912345678'
                },
                {
                    id: '2',
                    phoneModel: 'سامسونج جالكسي S24\nألترا 2024',
                    price: 1600000,
                    storage: 512,
                    ram: 12,
                    status: 'new',
                    brand: 'Samsung',
                    mainImage: 'https://images.unsplash.com/photo-1610945265078-3858a0b5d8f4?w=400&h=400&fit=crop',
                    userName: 'موبايل ستي',
                    city: 'أم درمان',
                    contactPhone: '+249923456789',
                    whatsApp: '+249923456789'
                }
            ];
        }

        function renderPhones(phones) {
            const container = document.getElementById('phonesContainer');
            const activePhones = phones.filter(p => p.isActive !== false && p.isSold !== true);

            if (activePhones.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;">لا توجد هواتف متاحة</div>';
                return;
            }

            container.innerHTML = activePhones.map(phone => buildCardHTML(phone)).join('');
        }

        function buildCardHTML(phone) {
            const price = phone.price ? parseInt(phone.price).toLocaleString() : '???';
            const image = phone.mainImage || (phone.images && phone.images[0]) || 'https://via.placeholder.com/400?text=No+Image';

            // Storage spec
            const storageText = phone.storage ? `سعة ${phone.storage} جيجابايت` : '';
            // RAM spec  
            const ramText = phone.ram ? `رامات ${phone.ram} جيجابايت` : '';
            // Status spec
            const statusText = phone.status === 'new' ? 'جديد' : (phone.status === 'like-new' ? 'شبه جديد' : 'مستعمل');

            return `
                <div class="phone-card" onclick="openPhoneModal('${phone.id}')">
                    <div class="phone-card-img">
                        <img src="${image}" alt="${phone.phoneModel || 'هاتف'}" 
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/400?text=No+Image';">
                    </div>
                    <div class="phone-card-body">
                        <div class="phone-card-title">${(phone.phoneModel || 'هاتف').replace(/\n/g, '<br>')}</div>
                        <div class="phone-card-specs">
                            <div class="spec-item">
                                <div class="spec-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                                        <path d="M4 12h16M12 4v16"/>
                                    </svg>
                                </div>
                                <div class="spec-text">${storageText || '256 جيجابايت'}</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect x="2" y="7" width="20" height="10" rx="2"/>
                                        <path d="M6 7v10M18 7v10"/>
                                        <path d="M8 10h2M8 14h2M14 10h2M14 14h2"/>
                                    </svg>
                                </div>
                                <div class="spec-text">${ramText || '8 رامات'}</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect x="5" y="2" width="14" height="20" rx="2"/>
                                        <line x1="12" y1="18" x2="12" y2="18.01"/>
                                    </svg>
                                </div>
                                <div class="spec-text">${statusText}</div>
                            </div>
                        </div>
                        <div class="phone-card-price">
                            <span>SDG</span> ${price}
                        </div>
                    </div>
                </div>
            `;
        }

        window.filterPhones = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPhones.filter(phone => {
                const isActive = phone.isActive !== false && phone.isSold !== true;
                const matchesSearch = !searchTerm || 
                    phone.phoneModel?.toLowerCase().includes(searchTerm) ||
                    phone.userName?.toLowerCase().includes(searchTerm) ||
                    phone.city?.toLowerCase().includes(searchTerm) ||
                    phone.brand?.toLowerCase().includes(searchTerm);
                return isActive && matchesSearch;
            });
            renderPhones(filtered);
        };

        window.openPhoneModal = function(phoneId) {
            const phone = allPhones.find(p => p.id === phoneId);
            if (!phone) return;
            currentPhone = phone;

            const price = phone.price ? parseInt(phone.price).toLocaleString() : '???';
            const image = phone.mainImage || (phone.images && phone.images[0]) || 'https://via.placeholder.com/400?text=No+Image';

            document.getElementById('modalImg').innerHTML = `<img src="${image}" alt="${phone.phoneModel}" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">`;
            document.getElementById('modalTitle').textContent = (phone.phoneModel || 'هاتف').replace(/\n/g, ' ');
            document.getElementById('modalPrice').innerHTML = `<span>SDG</span> ${price}`;

            let specsHtml = '';
            if (phone.storage) specsHtml += `
                <div class="modal-spec-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>
                    <div class="modal-spec-label">التخزين</div>
                    <div class="modal-spec-value">${phone.storage} GB</div>
                </div>`;
            if (phone.ram) specsHtml += `
                <div class="modal-spec-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 7v10M18 7v10"/><path d="M8 10h2M8 14h2M14 10h2M14 14h2"/></svg>
                    <div class="modal-spec-label">الرام</div>
                    <div class="modal-spec-value">${phone.ram} GB</div>
                </div>`;
            specsHtml += `
                <div class="modal-spec-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>
                    <div class="modal-spec-label">الحالة</div>
                    <div class="modal-spec-value">${phone.status === 'new' ? 'جديد' : (phone.status === 'like-new' ? 'شبه جديد' : 'مستعمل')}</div>
                </div>`;

            document.getElementById('modalSpecs').innerHTML = specsHtml;

            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('phoneModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = function() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('phoneModal').classList.remove('active');
            document.body.style.overflow = '';
            currentPhone = null;
        };

        window.contactWhatsApp = function() {
            if (!currentPhone || !currentPhone.whatsApp) {
                alert('رقم الواتساب غير متاح');
                return;
            }
            const num = currentPhone.whatsApp.toString().replace(/[\s\-]/g, '').replace(/^\+/, '');
            const msg = `مرحباً، أنا مهتم بـ: ${currentPhone.phoneModel}`;
            window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.contactCall = function() {
            if (!currentPhone || !currentPhone.contactPhone) {
                alert('رقم الهاتف غير متاح');
                return;
            }
            window.open(`tel:${currentPhone.contactPhone}`, '_self');
        };

        window.setNav = function(el, page) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            if (page === 'stores') alert('قسم المتاجر قريباً!');
            if (page === 'chats') alert('قسم المحادثات قريباً!');
            if (page === 'list') alert('قسم قائمتي قريباً!');
        };

        window.showFilters = function() { alert('قسم الفلترة قريباً!'); };
        window.showAllPhones = function() { alert('عرض جميع الهواتف قريباً!'); };
        window.addAd = function() { alert('إضافة إعلان جديد قريباً!'); };
        window.showProfile = function() { alert('صفحة الحساب قريباً!'); };
        window.showFavorites = function() { alert('المفضلة قريباً!'); };
        window.showNotifications = function() { alert('لديك إشعار جديد!'); };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => { loadPhones(); });
    </script>
</body>
</html>
