    <style>
        * { font-family: 'Cairo', sans-serif; }
        .phone-card { transition: all 0.3s ease; }
        .phone-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
        .status-new { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .status-like-new { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
        .status-used { background: linear-gradient(135deg, #f59e0b, #ea580c); }
        .stores-scroll { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .store-card { scroll-snap-align: start; flex-shrink: 0; }
        .search-box:focus-within { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        .loading-skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%; animation: skeleton 1.5s infinite;
        }
        @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .thumb-img { transition: all 0.2s ease; cursor: pointer; border: 2px solid transparent; }
        .thumb-img.active { border-color: #4f46e5; opacity: 1; }
        .thumb-img:hover { opacity: 0.8; }
    </style>

    <!-- Firebase + JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";
        import { 
            getFirestore, collection, query, orderBy, limit, onSnapshot, getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // ════════════════════════════════════════════
        // [Firebase Config] - مطابق تماماً لكود النشر
        // ════════════════════════════════════════════
        const firebaseConfig = {
            apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
            authDomain: "phone-soug.firebaseapp.com",
            databaseURL: "https://phone-soug-default-rtdb.firebaseio.com",
            projectId: "phone-soug",
            storageBucket: "phone-soug.firebasestorage.app",
            messagingSenderId: "224588578227",
            appId: "1:224588578227:web:f3127dfbea31a77d521fc6",
            measurementId: "G-S87955B526"
        };

        console.log("🔥 Firebase Config:", firebaseConfig);

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        console.log("✅ Firebase Initialized");

        let allPhones = [];
        let currentBrand = '';
        let unsubscribePhones = null;

        // ════════════════════════════════════════════
        // [1] جلب الإعلانات - استعلام بسيط بدون where
        // ════════════════════════════════════════════
        async function loadPhones() {
            try {
                console.log("📡 Loading ads from Firestore...");
                
                // استعلام بسيط: فقط ترتيب حسب التاريخ + حد 50
                // لا نستخدم where هنا لتجنب الحاجة لفهرس مركب
                const phonesQuery = query(
                    collection(db, 'ads'), 
                    orderBy('createdAt', 'desc'),
                    limit(50)
                );

                console.log("📡 Query created:", phonesQuery);

                unsubscribePhones = onSnapshot(phonesQuery, (snapshot) => {
                    console.log("📨 Snapshot received, docs count:", snapshot.docs.length);
                    
                    allPhones = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        console.log("📄 Doc:", doc.id, data);
                        allPhones.push({ id: doc.id, ...data });
                    });
                    
                    console.log("📊 Total ads loaded:", allPhones.length);
                    
                    hideLoading();
                    renderPhones(allPhones);
                    extractStoresFromAds(allPhones);
                    
                }, (error) => {
                    console.error("❌ Firestore Error:", error);
                    console.error("❌ Error Code:", error.code);
                    console.error("❌ Error Message:", error.message);
                    
                    // إذا فشل الاستعلام، جرب getDocs كبديل
                    console.log("🔄 Trying getDocs instead...");
                    fallbackLoad();
                });

            } catch (error) {
                console.error("❌ Critical Error in loadPhones:", error);
                hideLoading();
                renderPhones([]);
            }
        }

        // ════════════════════════════════════════════
        // [Fallback] إذا فشل onSnapshot
        // ════════════════════════════════════════════
        async function fallbackLoad() {
            try {
                const q = query(collection(db, 'ads'), limit(50));
                const snapshot = await getDocs(q);
                console.log("📨 Fallback loaded:", snapshot.docs.length, "docs");
                
                allPhones = [];
                snapshot.forEach((doc) => {
                    allPhones.push({ id: doc.id, ...doc.data() });
                });
                
                hideLoading();
                renderPhones(allPhones);
                extractStoresFromAds(allPhones);
            } catch (err) {
                console.error("❌ Fallback also failed:", err);
                hideLoading();
                document.getElementById('phonesCount').textContent = 'خطأ في الاتصال';
            }
        }

        // ════════════════════════════════════════════
        // [2] استخراج البائعين من الإعلانات
        // ════════════════════════════════════════════
        function extractStoresFromAds(ads) {
            const sellersMap = new Map();
            
            ads.forEach(ad => {
                const key = ad.userId || ad.userEmail || ad.userName;
                if (!key) return;
                
                if (!sellersMap.has(key)) {
                    sellersMap.set(key, {
                        name: ad.userName || 'بائع',
                        city: ad.city || 'السودان',
                        phoneCount: 1,
                        whatsapp: ad.whatsApp || ad.contactPhone,
                        phone: ad.contactPhone
                    });
                } else {
                    sellersMap.get(key).phoneCount += 1;
                }
            });
            
            const stores = Array.from(sellersMap.values());
            console.log("🏪 Stores extracted:", stores.length);
            renderStores(stores);
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('phonesGrid').classList.remove('hidden');
        }

        // ════════════════════════════════════════════
        // [3] عرض الهواتف - متوافق مع حقول 'ads'
        // ════════════════════════════════════════════
        window.renderPhones = function(phones) {
            const grid = document.getElementById('phonesGrid');
            const noResults = document.getElementById('noResults');
            const countEl = document.getElementById('phonesCount');
            
            // فلترة العميل: إظهار فقط النشط وغير المباع
            const activePhones = phones.filter(p => p.isActive !== false && p.isSold !== true);
            
            countEl.textContent = activePhones.length + ' هاتف';
            
            if (activePhones.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            
            grid.innerHTML = activePhones.map((phone) => {
                const statusConfig = {
                    'new': { label: 'جديد', class: 'status-new' },
                    'like-new': { label: 'شبه جديد', class: 'status-like-new' },
                    'used': { label: 'مستعمل', class: 'status-used' }
                }[phone.status] || { label: 'مستعمل', class: 'status-used' };

                const price = phone.price ? parseInt(phone.price).toLocaleString() : '???';
                const image = phone.mainImage || (phone.images && phone.images[0]) || 'https://via.placeholder.com/400?text=No+Image';

                return `
                    <div class="phone-card bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 cursor-pointer" onclick="openPhoneModal('${phone.id}')">
                        <div class="relative aspect-square bg-gradient-to-br from-slate-50 to-slate-100 overflow-hidden">
                            <img src="${image}" alt="${phone.phoneModel || 'هاتف'}" 
                                 class="w-full h-full object-contain p-4 hover:scale-105 transition-transform duration-500"
                                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400?text=No+Image';">
                            <div class="absolute top-3 right-3">
                                <span class="${statusConfig.class} text-white px-3 py-1 rounded-lg text-xs font-bold shadow-lg">${statusConfig.label}</span>
                            </div>
                            <div class="absolute bottom-3 left-3">
                                <span class="bg-white/95 backdrop-blur px-3 py-1.5 rounded-lg shadow-md">
                                    <span class="text-lg font-bold text-indigo-600">${price}</span>
                                    <span class="text-xs text-slate-500">ج.س</span>
                                </span>
                            </div>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-slate-900 mb-1 truncate">${phone.phoneModel || 'هاتف'}</h3>
                            <div class="flex items-center gap-3 text-xs text-slate-500 mb-3">
                                ${phone.ram ? `<span class="flex items-center gap-1"><i class="fas fa-memory text-indigo-400"></i> ${phone.ram} GB</span>` : ''}
                                ${phone.storage ? `<span class="flex items-center gap-1"><i class="fas fa-hdd text-indigo-400"></i> ${phone.storage} GB</span>` : ''}
                                ${phone.batteryHealth ? `<span class="flex items-center gap-1"><i class="fas fa-battery-full text-green-400"></i> ${phone.batteryHealth}%</span>` : ''}
                            </div>
                            <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                                        <i class="fas fa-user text-indigo-600 text-xs"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-semibold text-slate-700 truncate max-w-[100px]">${phone.userName || 'بائع'}</p>
                                        <p class="text-[10px] text-slate-400">${phone.city || 'السودان'}</p>
                                    </div>
                                </div>
                                <div class="flex gap-1">
                                    ${(phone.contactMethods?.includes('whatsapp') || phone.whatsApp) ? `
                                    <a href="https://wa.me/${formatWaForLink(phone.whatsApp || phone.contactPhone)}" onclick="event.stopPropagation()" 
                                       class="w-8 h-8 bg-green-500 hover:bg-green-600 text-white rounded-lg flex items-center justify-center transition-colors">
                                        <i class="fab fa-whatsapp text-sm"></i>
                                    </a>` : ''}
                                    ${(phone.contactMethods?.includes('call') || phone.contactPhone) ? `
                                    <a href="tel:${phone.contactPhone}" onclick="event.stopPropagation()" 
                                       class="w-8 h-8 bg-blue-500 hover:bg-blue-600 text-white rounded-lg flex items-center justify-center transition-colors">
                                        <i class="fas fa-phone text-xs"></i>
                                    </a>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // ════════════════════════════════════════════
        // [4] عرض المتاجر
        // ════════════════════════════════════════════
        window.renderStores = function(stores) {
            const container = document.getElementById('storesContainer');
            if (stores.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">لا يوجد متاجر حالياً</p>';
                return;
            }
            
            container.innerHTML = stores.map(store => {
                const logoUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(store.name)}&background=6366f1&color=fff&size=128&bold=true`;
                return `
                    <div class="store-card w-72 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                        <div class="flex items-center gap-3 mb-4">
                            <img src="${logoUrl}" alt="${store.name}" class="w-14 h-14 rounded-xl object-cover border-2 border-slate-100 shadow-sm">
                            <div>
                                <h3 class="font-bold text-slate-900">${store.name}</h3>
                                <p class="text-xs text-slate-500">${store.city || 'السودان'}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-sm mb-4">
                            <span class="text-slate-500">${store.phoneCount || 0} هاتف</span>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-star text-yellow-400 text-xs"></i>
                                <span class="font-semibold">4.5</span>
                            </div>
                        </div>
                        <a href="https://wa.me/${formatWaForLink(store.whatsapp || store.phone)}" 
                           class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white text-center py-2.5 rounded-xl font-semibold text-sm transition-colors">
                            تواصل مع البائع
                        </a>
                    </div>
                `;
            }).join('');
        };

        // ════════════════════════════════════════════
        // [5] فلترة الشركات
        // ════════════════════════════════════════════
        window.setBrandFilter = function(brand) {
            currentBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(btn => {
                if (btn.dataset.brand === brand) {
                    btn.classList.add('active', 'bg-indigo-50', 'border-indigo-500', 'text-indigo-700');
                    btn.classList.remove('bg-white', 'border-slate-200', 'text-slate-600');
                } else {
                    btn.classList.remove('active', 'bg-indigo-50', 'border-indigo-500', 'text-indigo-700');
                    btn.classList.add('bg-white', 'border-slate-200', 'text-slate-600');
                }
            });
            filterPhones();
        };

        // ════════════════════════════════════════════
        // [6] البحث والفلترة
        // ════════════════════════════════════════════
        window.filterPhones = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allPhones.filter(phone => {
                const isActive = phone.isActive !== false && phone.isSold !== true;
                const matchesSearch = !searchTerm || 
                    phone.phoneModel?.toLowerCase().includes(searchTerm) ||
                    phone.userName?.toLowerCase().includes(searchTerm) ||
                    phone.city?.toLowerCase().includes(searchTerm) ||
                    phone.neighborhood?.toLowerCase().includes(searchTerm) ||
                    phone.description?.toLowerCase().includes(searchTerm);
                const matchesBrand = !currentBrand || phone.brand === currentBrand;
                
                return isActive && matchesSearch && matchesBrand;
            });
            
            renderPhones(filtered);
        };

        window.scrollStores = function(direction) {
            const container = document.getElementById('storesContainer');
            container.scrollBy({ left: direction === 'right' ? -300 : 300, behavior: 'smooth' });
        };

        // ════════════════════════════════════════════
        // [7] Modal - تفاصيل الهاتف
        // ════════════════════════════════════════════
        window.openPhoneModal = function(phoneId) {
            const phone = allPhones.find(p => p.id === phoneId);
            if (!phone) return;
            
            const statusConfig = {
                'new': { label: 'جديد', class: 'status-new' },
                'like-new': { label: 'شبه جديد', class: 'status-like-new' },
                'used': { label: 'مستعمل', class: 'status-used' }
            }[phone.status] || { label: 'مستعمل', class: 'status-used' };

            const price = phone.price ? parseInt(phone.price).toLocaleString() : '???';
            const images = phone.images || [];
            const mainImg = phone.mainImage || images[0] || 'https://via.placeholder.com/400?text=No+Image';
            
            const thumbnailsHtml = images.length > 1 ? `
                <div class="flex gap-2 mt-4 justify-center flex-wrap">
                    ${images.map((img, idx) => `
                        <img src="${img}" onclick="changeModalImage('${img}')"
                             class="thumb-img w-16 h-16 rounded-lg object-cover ${idx === 0 ? 'active' : ''}"
                             onerror="this.style.display='none'">
                    `).join('')}
                </div>
            ` : '';

            const modal = document.getElementById('phoneModal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <div class="md:flex h-full">
                    <div class="md:w-1/2 bg-gradient-to-br from-slate-50 to-indigo-50 p-6 flex flex-col items-center justify-center">
                        <img id="modalMainImage" src="${mainImg}" class="max-h-80 object-contain drop-shadow-xl"
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/400?text=No+Image';">
                        ${thumbnailsHtml}
                    </div>
                    <div class="md:w-1/2 p-6 overflow-y-auto">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="${statusConfig.class} text-white px-3 py-1 rounded-lg text-sm font-bold">${statusConfig.label}</span>
                            <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-sm font-semibold">${phone.brand?.toUpperCase() || 'UNKNOWN'}</span>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 mb-2">${phone.phoneModel || 'هاتف'}</h2>
                        ${phone.description ? `<p class="text-slate-500 text-sm mb-4">${phone.description}</p>` : ''}
                        <div class="flex items-baseline gap-2 mb-5">
                            <span class="text-3xl font-bold text-indigo-600">${price}</span>
                            <span class="text-lg text-slate-500">جنيه سوداني</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-5">
                            ${phone.ram ? `<div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-500">الرام</p><p class="font-bold text-slate-900">${phone.ram} GB</p></div>` : ''}
                            ${phone.storage ? `<div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-500">التخزين</p><p class="font-bold text-slate-900">${phone.storage} GB</p></div>` : ''}
                            ${phone.batteryHealth ? `<div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-500">صحة البطارية</p><p class="font-bold text-slate-900">${phone.batteryHealth}%</p></div>` : ''}
                            ${phone.camera ? `<div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-500">الكاميرا</p><p class="font-bold text-slate-900">${phone.camera}</p></div>` : ''}
                            ${phone.waterResistant !== undefined && phone.waterResistant !== null ? `<div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-500">مقاومة الماء</p><p class="font-bold text-slate-900">${phone.waterResistant === true || phone.waterResistant === 'true' ? 'نعم' : 'لا'}</p></div>` : ''}
                            ${phone.color ? `<div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-500">اللون</p><p class="font-bold text-slate-900">${phone.color}</p></div>` : ''}
                        </div>
                        <div class="bg-slate-50 rounded-xl p-4 mb-5">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user text-indigo-600 text-lg"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-900">${phone.userName || 'بائع'}</h4>
                                    <p class="text-sm text-slate-500">${phone.city || 'السودان'} ${phone.neighborhood ? '- ' + phone.neighborhood : ''}</p>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${(phone.contactMethods?.includes('whatsapp') || phone.whatsApp) ? `
                            <a href="https://wa.me/${formatWaForLink(phone.whatsApp || phone.contactPhone)}" 
                               class="block w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold text-center transition-colors flex items-center justify-center gap-2">
                                <i class="fab fa-whatsapp text-xl"></i> تواصل عبر واتساب
                            </a>` : ''}
                            ${(phone.contactMethods?.includes('call') || phone.contactPhone) ? `
                            <a href="tel:${phone.contactPhone}" 
                               class="block w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-xl font-bold text-center transition-colors flex items-center justify-center gap-2">
                                <i class="fas fa-phone"></i> اتصل الآن
                            </a>` : ''}
                            ${phone.contactMethods?.includes('message') ? `
                            <button onclick="showLogin()" 
                                    class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-center transition-colors flex items-center justify-center gap-2">
                                <i class="fas fa-comment-dots"></i> رسالة داخلية
                            </button>` : ''}
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.changeModalImage = function(src) {
            const mainImg = document.getElementById('modalMainImage');
            if (mainImg) mainImg.src = src;
            document.querySelectorAll('.thumb-img').forEach(img => {
                img.classList.remove('active');
                if (img.src === src) img.classList.add('active');
            });
        };

        window.closeModal = function() {
            document.getElementById('phoneModal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        // ════════════════════════════════════════════
        // [8] مساعد: تنسيق رقم الواتساب للرابط
        // ════════════════════════════════════════════
        function formatWaForLink(num) {
            if (!num) return '';
            // إزالة + ومسافات وشرطات
            let clean = num.toString().replace(/[\s\-]/g, '');
            // إذا بدأ بـ + نزيله فقط (نترك 249)
            clean = clean.replace(/^\+/, '');
            return clean;
        }

        window.showLogin = function() {
            alert('يجب تسجيل الدخول أولاً!');
        };

        // ════════════════════════════════════════════
        // [9] تهيئة
        // ════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 DOM Ready - Starting app...");
            loadPhones();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('beforeunload', () => {
            if (unsubscribePhones) unsubscribePhones();
        });
    </script>
</body>
</html>
