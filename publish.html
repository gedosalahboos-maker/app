<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر إعلان - سوق فون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        .radio-card { transition: all 0.2s ease; cursor: pointer; }
        .radio-card:hover { border-color: #4f46e5; }
        .radio-card.selected { border-color: #4f46e5; background: #eef2ff; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-slate-600 hover:text-indigo-600 transition-colors">
                <i class="fas fa-arrow-right"></i>
                <span class="font-semibold">رجوع</span>
            </a>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-mobile-alt text-white text-sm"></i>
                </div>
                <h1 class="font-bold text-lg text-slate-900">نشر إعلان</h1>
            </div>
            <div class="w-20"></div>
        </div>
    </nav>

    <div class="bg-white border-b border-slate-200 py-6" id="progressBar">
        <div class="max-w-3xl mx-auto px-4">
            <div class="flex items-center justify-between relative">
                <div class="absolute top-1/2 left-0 right-0 h-1 bg-slate-200 -translate-y-1/2 z-0"></div>
                <div id="progressFill" class="absolute top-1/2 right-0 h-1 bg-indigo-600 -translate-y-1/2 z-0" style="width: 0%"></div>
                <div class="relative z-10 flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm border-4 border-white shadow">1</div><span class="text-xs font-semibold mt-2 text-indigo-600">الهاتف</span></div>
                <div class="relative z-10 flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm border-4 border-white shadow">2</div><span class="text-xs font-semibold mt-2 text-slate-500">المواصفات</span></div>
                <div class="relative z-10 flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm border-4 border-white shadow">3</div><span class="text-xs font-semibold mt-2 text-slate-500">الصور</span></div>
                <div class="relative z-10 flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm border-4 border-white shadow">4</div><span class="text-xs font-semibold mt-2 text-slate-500">السعر</span></div>
                <div class="relative z-10 flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm border-4 border-white shadow">5</div><span class="text-xs font-semibold mt-2 text-slate-500">التواصل</span></div>
            </div>
        </div>
    </div>

    <main class="max-w-2xl mx-auto px-4 py-8" id="mainContent">
        <!-- Step 1 -->
        <div id="step-1" class="step-content active">
            <h2 class="text-xl font-bold text-slate-900 mb-2">اختيار الهاتف</h2>
            <form onsubmit="nextStep(2); return false;">
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-700 mb-3">الشركة المصنعة <span class="text-red-500">*</span></label>
                    <div class="grid grid-cols-4 gap-3">
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectBrand(this, 'apple')"><input type="radio" name="brand" value="apple" class="hidden" required><i class="fab fa-apple text-2xl text-slate-700 mb-1 block"></i><span class="text-xs font-bold">Apple</span></label>
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectBrand(this, 'samsung')"><input type="radio" name="brand" value="samsung" class="hidden"><i class="fab fa-android text-2xl text-blue-600 mb-1 block"></i><span class="text-xs font-bold">Samsung</span></label>
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectBrand(this, 'xiaomi')"><input type="radio" name="brand" value="xiaomi" class="hidden"><span class="text-xl font-black text-orange-600 block mb-1">Mi</span><span class="text-xs font-bold">Xiaomi</span></label>
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectBrand(this, 'oppo')"><input type="radio" name="brand" value="oppo" class="hidden"><span class="text-xl font-black text-green-600 block mb-1">OP</span><span class="text-xs font-bold">OPPO</span></label>
                    </div>
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-700 mb-2">نوع الهاتف <span class="text-red-500">*</span></label>
                    <select id="phoneModel" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" required disabled><option value="">اختر الشركة أولاً</option></select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition-colors">التالي</button>
            </form>
        </div>

        <!-- Step 2 -->
        <div id="step-2" class="step-content">
            <h2 class="text-xl font-bold text-slate-900 mb-2">المواصفات التقنية</h2>
            <form onsubmit="nextStep(3); return false;">
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-700 mb-2">الرام</label>
                    <div class="grid grid-cols-4 gap-3">
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectRam(this, '4')"><input type="radio" name="ram" value="4" class="hidden"><span class="font-bold">4 GB</span></label>
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectRam(this, '6')"><input type="radio" name="ram" value="6" class="hidden"><span class="font-bold">6 GB</span></label>
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectRam(this, '8')"><input type="radio" name="ram" value="8" class="hidden"><span class="font-bold">8 GB</span></label>
                        <label class="radio-card border-2 border-slate-200 rounded-xl p-3 text-center" onclick="selectRam(this, '12')"><input type="radio" name="ram" value="12" class="hidden"><span class="font-bold">12 GB</span></label>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="prevStep(1)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">رجوع</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold">التالي</button>
                </div>
            </form>
        </div>

        <!-- Step 3 -->
        <div id="step-3" class="step-content">
            <h2 class="text-xl font-bold text-slate-900 mb-2">صور الهاتف</h2>
            <div class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center mb-6 cursor-pointer hover:border-indigo-400 transition-colors" onclick="document.getElementById('imageInput').click()">
                <input type="file" id="imageInput" multiple accept="image/*" class="hidden" onchange="handleImages(this.files)">
                <i class="fas fa-camera text-4xl text-indigo-600 mb-4"></i>
                <p class="font-semibold">اضغط لاختيار الصور</p>
            </div>
            <div id="imagePreview" class="grid grid-cols-3 gap-3 mb-6 hidden"></div>
            <div class="flex gap-3">
                <button type="button" onclick="prevStep(2)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">رجوع</button>
                <button type="button" onclick="nextStep(4)" id="nextToPrice" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold" disabled>التالي</button>
            </div>
        </div>

        <!-- Step 4 -->
        <div id="step-4" class="step-content">
            <h2 class="text-xl font-bold text-slate-900 mb-2">السعر والحالة</h2>
            <form onsubmit="nextStep(5); return false;">
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-700 mb-2">السعر <span class="text-red-500">*</span></label>
                    <input type="text" id="price" placeholder="300,000" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 text-2xl font-bold" oninput="formatPrice(this)" required>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="prevStep(3)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">رجوع</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold">التالي</button>
                </div>
            </form>
        </div>

        <!-- Step 5 -->
        <div id="step-5" class="step-content">
            <h2 class="text-xl font-bold text-slate-900 mb-2">الموقع والتواصل</h2>
            <form onsubmit="publishAd(event)">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-700 mb-2">المدينة <span class="text-red-500">*</span></label>
                    <input type="text" id="city" placeholder="الخرطوم" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-700 mb-2">رقم الهاتف <span class="text-red-500">*</span></label>
                    <input type="tel" id="contactPhone" placeholder="+249912345678" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" required>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="prevStep(4)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">رجوع</button>
                    <button type="submit" id="publishBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                        <span>نشر الإعلان</span><i class="fas fa-check"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Auth Step -->
        <div id="auth-step" class="hidden">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">تسجيل الدخول مطلوب</h2>
                <p class="text-slate-500">سجل دخول لإتمام نشر الإعلان</p>
            </div>
            <div class="flex border-b border-slate-200 mb-6">
                <div class="flex-1 text-center py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold cursor-pointer" onclick="switchAuthTab('login')">تسجيل الدخول</div>
                <div class="flex-1 text-center py-3 text-slate-500 cursor-pointer" onclick="switchAuthTab('register')">إنشاء حساب</div>
            </div>
            <div id="loginForm">
                <form onsubmit="handleLogin(event)">
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 border border-slate-200 rounded-xl mb-4" required>
                    <input type="password" id="loginPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 border border-slate-200 rounded-xl mb-6" required>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mb-4">تسجيل الدخول</button>
                </form>
            </div>
            <div id="registerForm" class="hidden">
                <form onsubmit="handleRegister(event)">
                    <input type="text" id="regName" placeholder="الاسم" class="w-full px-4 py-3 border border-slate-200 rounded-xl mb-4" required>
                    <input type="email" id="regEmail" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 border border-slate-200 rounded-xl mb-4" required>
                    <input type="password" id="regPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 border border-slate-200 rounded-xl mb-6" required>
                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold mb-4">إنشاء حساب</button>
                </form>
            </div>
        </div>

        <!-- Success -->
        <div id="final-success" class="hidden text-center py-12">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check text-4xl text-green-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">تم النشر بنجاح!</h2>
            <a href="index.html" class="inline-block bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold mt-4">الصفحة الرئيسية</a>
        </div>
    </main>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
            authDomain: "phone-soug.firebaseapp.com",
            projectId: "phone-soug",
            storageBucket: "phone-soug.firebasestorage.app",
            messagingSenderId: "224588578227",
            appId: "1:224588578227:web:46b4cb96ff2535a1521fc6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseFns = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, collection, addDoc, serverTimestamp };
    </script>

    <script>
        const phoneDatabase = {
            'apple': ['iPhone 16 Pro Max', 'iPhone 15 Pro', 'iPhone 14', 'iPhone 13', 'iPhone 12', 'iPhone 11', 'iPhone SE'],
            'samsung': ['Galaxy S24 Ultra', 'Galaxy S23', 'Galaxy S22', 'Galaxy Z Fold', 'Galaxy Z Flip', 'Galaxy A55'],
            'xiaomi': ['Xiaomi 14', 'Xiaomi 13', 'Redmi Note 13', 'POCO F6', 'POCO X6'],
            'oppo': ['Find X7', 'Reno 11', 'A98', 'F25 Pro']
        };

        let currentStep = 1, uploadedImages = [], formData = {}, selectedBrand = '';

        function selectBrand(el, brand) {
            selectedBrand = brand;
            document.querySelectorAll('input[name="brand"]').forEach(i => i.closest('.radio-card').classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
            const sel = document.getElementById('phoneModel');
            sel.disabled = false;
            sel.innerHTML = '<option value="">اختر نوع الهاتف</option>';
            (phoneDatabase[brand] || []).forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); });
        }

        function selectRam(el, v) {
            document.querySelectorAll('input[name="ram"]').forEach(i => i.closest('.radio-card').classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function nextStep(s) {
            saveData(currentStep);
            document.getElementById('step-' + currentStep).classList.remove('active');
            document.getElementById('step-' + s).classList.add('active');
            updateProgress(s);
            currentStep = s;
        }

        function prevStep(s) {
            document.getElementById('step-' + currentStep).classList.remove('active');
            document.getElementById('step-' + s).classList.add('active');
            updateProgress(s);
            currentStep = s;
        }

        function updateProgress(s) {
            document.getElementById('progressFill').style.width = ((s - 1) / 4 * 100) + '%';
        }

        function saveData(step) {
            if (step === 1) { formData.brand = selectedBrand; formData.phoneModel = document.getElementById('phoneModel').value; }
            else if (step === 2) { formData.ram = document.querySelector('input[name="ram"]:checked')?.value; }
            else if (step === 4) { formData.price = document.getElementById('price').value.replace(/,/g, ''); }
        }

        function handleImages(files) {
            Array.from(files).slice(0, 3 - uploadedImages.length).forEach(file => {
                const reader = new FileReader();
                reader.onload = e => { uploadedImages.push({ file, preview: e.target.result }); updateImageUI(); };
                reader.readAsDataURL(file);
            });
        }

        function updateImageUI() {
            const preview = document.getElementById('imagePreview');
            preview.classList.remove('hidden');
            preview.innerHTML = uploadedImages.map((img, i) => `
                <div class="relative aspect-square rounded-xl overflow-hidden border">
                    <img src="${img.preview}" class="w-full h-full object-cover">
                    <button onclick="removeImage(${i})" class="absolute top-2 left-2 w-8 h-8 bg-red-500 text-white rounded-lg"><i class="fas fa-times"></i></button>
                </div>`).join('');
            document.getElementById('nextToPrice').disabled = uploadedImages.length < 1;
        }

        function removeImage(i) { uploadedImages.splice(i, 1); updateImageUI(); }

        function formatPrice(input) {
            let v = input.value.replace(/[^\d]/g, '');
            input.value = v ? v.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
        }

        async function publishAd(e) {
            e.preventDefault();
            saveData(5);
            formData.city = document.getElementById('city').value;
            formData.contactPhone = document.getElementById('contactPhone').value;

            const btn = document.getElementById('publishBtn');
            btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
            btn.disabled = true;

            try {
                await waitForFirebase();
                const user = window.firebaseAuth.currentUser;

                if (!user) {
                    document.getElementById('step-5').classList.remove('active');
                    document.getElementById('auth-step').classList.remove('hidden');
                    btn.innerHTML = '<span>نشر الإعلان</span><i class="fas fa-check"></i>';
                    btn.disabled = false;
                    return;
                }

                // Upload images to Cloudinary first (or skip if not configured)
                const imageUrls = uploadedImages.length > 0 ? await uploadToCloudinary(uploadedImages[0].file) : { url: '' };

                const adData = {
                    name: formData.phoneModel,
                    brand: formData.brand,
                    price: parseInt(formData.price) || 0,
                    ram: formData.ram,
                    status: 'used',
                    city: formData.city,
                    sellerName: user.displayName || user.email,
                    sellerPhone: formData.contactPhone,
                    whatsapp: formData.contactPhone,
                    mainImage: imageUrls.url,
                    createdAt: window.firebaseFns.serverTimestamp(),
                    userId: user.uid
                };

                await window.firebaseFns.addDoc(window.firebaseFns.collection(window.firebaseDb, 'phones'), adData);
                document.getElementById('step-5').classList.remove('active');
                document.getElementById('final-success').classList.remove('hidden');
            } catch (err) {
                alert('خطأ: ' + err.message);
                console.error(err);
                btn.innerHTML = '<span>نشر الإعلان</span><i class="fas fa-check"></i>';
                btn.disabled = false;
            }
        }

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'phone_soug_unsigned');
            const res = await fetch('https://api.cloudinary.com/v1_1/dxbfupupw/image/upload', { method: 'POST', body: formData });
            const data = await res.json();
            return { url: data.secure_url };
        }

        async function waitForFirebase() {
            let attempts = 0;
            while (!window.firebaseAuth && attempts < 30) { await new Promise(r => setTimeout(r, 100)); attempts++; }
            if (!window.firebaseAuth) throw new Error('Firebase not initialized');
        }

        function switchAuthTab(mode) {
            if (mode === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            try {
                await waitForFirebase();
                const { signInWithEmailAndPassword } = window.firebaseFns;
                await signInWithEmailAndPassword(window.firebaseAuth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
                document.getElementById('auth-step').classList.add('hidden');
                document.getElementById('step-5').classList.add('active');
                publishAd({ preventDefault: () => {} });
            } catch (err) { alert('خطأ في تسجيل الدخول: ' + err.message); }
        }

        async function handleRegister(e) {
            e.preventDefault();
            try {
                await waitForFirebase();
                const { createUserWithEmailAndPassword, updateProfile } = window.firebaseFns;
                const cred = await createUserWithEmailAndPassword(window.firebaseAuth, document.getElementById('regEmail').value, document.getElementById('regPassword').value);
                await updateProfile(cred.user, { displayName: document.getElementById('regName').value });
                document.getElementById('auth-step').classList.add('hidden');
                document.getElementById('step-5').classList.add('active');
                publishAd({ preventDefault: () => {} });
            } catch (err) { alert('خطأ: ' + err.message); }
        }
    </script>
</body>
</html>
