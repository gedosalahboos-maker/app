<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة ملف شخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .upload-zone { border: 2px dashed #667eea; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-zone:hover { background: rgba(102, 126, 234, 0.1); border-color: #764ba2; }
        .upload-zone.dragover { background: rgba(102, 126, 234, 0.2); border-color: #764ba2; }
        .image-preview { width: 150px; height: 150px; border-radius: 12px; object-fit: cover; margin: 20px auto; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 16px 20px; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000; animation: slideIn 0.3s ease; }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.info { border-left: 4px solid #3b82f6; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="min-h-screen flex items-center justify-center p-4">
    <div class="card bg-white rounded-2xl p-8 w-full max-w-md">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-user-circle text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">إضافة ملفك الشخصي</h1>
            <p class="text-gray-500">أدخل اسمك وصورتك</p>
        </div>

        <form id="uploadForm" onsubmit="handleSubmit(event)">
            
            <!-- Username Input -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    اسم المستخدم <span class="text-red-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="أدخل اسمك"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition"
                    required
                    minlength="2"
                    maxlength="50"
                >
            </div>

            <!-- Image Upload -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    الصورة <span class="text-red-500">*</span>
                </label>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('imageInput').click()">
                    <input 
                        type="file" 
                        id="imageInput" 
                        accept="image/*"
                        class="hidden"
                        onchange="handleImageSelect(this.files)"
                        required
                    >
                    <i class="fas fa-cloud-upload-alt text-4xl text-purple-500 mb-3 block"></i>
                    <p class="text-gray-700 font-semibold mb-1">اضغط أو اسحب الصورة هنا</p>
                    <p class="text-sm text-gray-500">PNG, JPG - حتى 5MB</p>
                </div>

                <!-- Image Preview -->
                <div id="previewContainer" class="hidden text-center">
                    <img id="previewImage" class="image-preview" alt="معاينة">
                    <button type="button" onclick="removeImage()" class="text-red-500 hover:text-red-700 text-sm font-semibold mt-2">
                        <i class="fas fa-trash"></i> إزالة الصورة
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white font-bold py-3 rounded-lg transition transform hover:scale-105 flex items-center justify-center gap-2"
            >
                <span>إضافة الملف الشخصي</span>
                <i class="fas fa-arrow-left"></i>
            </button>

            <!-- Link to View Page -->
            <div class="text-center mt-4">
                <a href="view_fixed.html" class="text-purple-600 hover:text-purple-700 font-semibold text-sm">
                    <i class="fas fa-eye"></i> عرض جميع الملفات الشخصية
                </a>
            </div>
        </form>

    </div>
</div>

<!-- Firebase SDK with Long Polling Fix -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, connectFirestoreEmulator } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
        authDomain: "phone-soug.firebaseapp.com",
        projectId: "phone-soug",
        storageBucket: "phone-soug.firebasestorage.app",
        messagingSenderId: "224588578227",
        appId: "1:224588578227:web:46b4cb96ff2535a1521fc6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Force Long Polling for better connectivity in regions with restrictions
    try {
        // Set Firestore settings to use Long Polling
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        
        const settings = {
            cacheSizeBytes: 40 * 1024 * 1024, // 40MB cache
            experimentalForceLongPolling: true, // Force Long Polling
            experimentalAutoDetectLongPolling: true
        };
        console.log('✅ تم تفعيل Long Polling لـ Firebase');
    } catch (e) {
        console.log('ℹ️ Long Polling settings applied');
    }

    // Cloudinary Config
    const CLOUDINARY_CLOUD_NAME = "dxbfupupw";
    const CLOUDINARY_UPLOAD_PRESET = "Ob7uqufu";

    let selectedFile = null;

    // Show Toast
    window.showToast = function(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
            <span style="margin-right: 10px;">${message}</span>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    };

    // Handle Image Select
    window.handleImageSelect = function(files) {
        if (!files || files.length === 0) return;
        
        const file = files[0];
        
        // Check file size
        if (file.size > 5 * 1024 * 1024) {
            window.showToast('الصورة كبيرة جداً (أقصى 5MB)', 'error');
            return;
        }

        selectedFile = file;
        
        // Show preview
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImage').src = e.target.result;
            document.getElementById('uploadZone').classList.add('hidden');
            document.getElementById('previewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    };

    // Remove Image
    window.removeImage = function() {
        selectedFile = null;
        document.getElementById('imageInput').value = '';
        document.getElementById('previewContainer').classList.add('hidden');
        document.getElementById('uploadZone').classList.remove('hidden');
    };

    // Upload to Cloudinary
    async function uploadToCloudinary(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        formData.append('cloud_name', CLOUDINARY_CLOUD_NAME);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('فشل رفع الصورة');
            
            const data = await response.json();
            return data.secure_url;
        } catch (error) {
            console.error('❌ خطأ Cloudinary:', error);
            throw new Error('فشل رفع الصورة إلى Cloudinary');
        }
    }

    // Handle Submit
    window.handleSubmit = async function(e) {
        e.preventDefault();

        if (!selectedFile) {
            window.showToast('يرجى اختيار صورة', 'error');
            return;
        }

        const username = document.getElementById('username').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.innerHTML;

        try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> جاري الرفع...';

            // Upload image to Cloudinary
            console.log('📤 جاري رفع الصورة إلى Cloudinary...');
            const imageUrl = await uploadToCloudinary(selectedFile);
            console.log('✅ تم رفع الصورة:', imageUrl);

            // Save to Firestore with retry logic
            console.log('💾 جاري حفظ البيانات في Firebase...');
            
            let retries = 3;
            let savedSuccessfully = false;
            
            while (retries > 0 && !savedSuccessfully) {
                try {
                    const docRef = await addDoc(collection(db, 'profiles'), {
                        username: username,
                        imageUrl: imageUrl,
                        createdAt: serverTimestamp()
                    });
                    console.log('✅ تم حفظ البيانات برقم:', docRef.id);
                    savedSuccessfully = true;
                    window.showToast('تم إضافة ملفك الشخصي بنجاح!', 'success');
                    
                    // Reset form
                    setTimeout(() => {
                        document.getElementById('uploadForm').reset();
                        window.removeImage();
                        document.getElementById('username').value = '';
                    }, 1500);
                } catch (error) {
                    retries--;
                    console.warn(`⚠️ محاولة فشلت، المحاولات المتبقية: ${retries}`);
                    if (retries > 0) {
                        console.log('🔄 جاري إعادة المحاولة...');
                        await new Promise(r => setTimeout(r, 2000)); // Wait 2 seconds before retry
                    } else {
                        throw error;
                    }
                }
            }

        } catch (error) {
            console.error('❌ خطأ:', error);
            window.showToast('خطأ: ' + error.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    };

    // Drag & Drop
    const uploadZone = document.getElementById('uploadZone');
    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        window.handleImageSelect(e.dataTransfer.files);
    });

    console.log('✅ Firebase و Cloudinary جاهزة مع Long Polling');
</script>

</body>
</html>
