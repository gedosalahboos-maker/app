<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أرشيف الشبطاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { 
            background: #f5f0e8; 
            overflow-x: hidden; 
            color: #2c1810;
        }

        /* Header - classic archive style */
        .archive-header {
            background: linear-gradient(180deg, #f5f0e8 0%, #ebe4d8 100%);
            padding: 24px 16px 16px;
            text-align: center;
            border-bottom: 1px solid #d4c9b8;
        }
        .archive-title {
            font-family: 'Amiri', serif;
            font-size: 32px;
            font-weight: 700;
            color: #2c1810;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .archive-subtitle {
            font-size: 14px;
            color: #8b7355;
            line-height: 1.8;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f5f0e8;
            border-bottom: 1px solid #d4c9b8;
        }
        .menu-btn {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            color: #5c4a3a; font-size: 20px;
        }
        .site-name {
            font-family: 'Amiri', serif;
            font-size: 18px; font-weight: 700;
            color: #2c1810;
        }

        /* Search */
        .search-section {
            padding: 16px;
            background: #f5f0e8;
        }
        .search-box {
            background: white;
            border: 1px solid #d4c9b8;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-box i {
            color: #8b7355; font-size: 16px;
        }
        .search-box input {
            flex: 1; border: none; outline: none;
            font-size: 14px; color: #2c1810;
            background: transparent;
        }
        .search-box input::placeholder {
            color: #b8a99a;
        }

        /* Category tabs */
        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            background: #f5f0e8;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #d4c9b8;
            background: white;
            color: #8b7355;
        }
        .cat-tab:hover {
            background: #f0ebe3;
            color: #5c4a3a;
        }
        .cat-tab.active {
            background: #2c1810;
            color: #f5f0e8;
            border-color: #2c1810;
        }

        /* Photo Grid - 2 columns like reference */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 0 16px 16px;
        }
        @media (min-width: 768px) {
            .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 24px 24px; }
        }
        @media (min-width: 1024px) {
            .photo-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 0 32px 32px; }
        }

        /* Photo Item */
        .photo-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            background: #e8e0d4;
            border-radius: 4px;
        }
        .photo-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.4s ease, filter 0.4s ease;
            opacity: 0;
            filter: grayscale(30%);
        }
        .photo-item img.loaded { 
            opacity: 1; 
            filter: grayscale(0%);
        }
        .photo-item:hover img { 
            transform: scale(1.05);
            filter: grayscale(0%);
        }
        .photo-item:hover .photo-info {
            opacity: 1;
            transform: translateY(0);
        }

        .photo-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(44,24,16,0.85) 0%, transparent 100%);
            padding: 20px 10px 10px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .photo-info .names {
            color: #f5f0e8;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .photo-info .cat-label {
            color: #d4c9b8;
            font-size: 10px;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Skeleton */
        .skeleton-photo {
            background: linear-gradient(90deg, #e8e0d4 25%, #ddd5c8 50%, #e8e0d4 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            aspect-ratio: 1;
            border-radius: 4px;
        }
        @keyframes shimmer { 
            0% { background-position: 200% 0; } 
            100% { background-position: -200% 0; } 
        }

        /* Load more */
        .load-more-section {
            text-align: center;
            padding: 24px 16px 80px;
        }
        .load-more-btn {
            background: #2c1810;
            color: #f5f0e8;
            padding: 12px 32px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }
        .load-more-btn:hover {
            background: #4a3020;
        }
        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Lightbox - classic style */
        .lightbox {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(44,24,16,0.95);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img {
            max-width: 92vw; max-height: 75vh;
            object-fit: contain; border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute; top: 16px; left: 16px;
            width: 44px; height: 44px;
            color: #f5f0e8; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: rgba(255,255,255,0.1);
            border-radius: 50%; border: none;
        }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 48px; height: 48px;
            color: #f5f0e8; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: rgba(255,255,255,0.1);
            border-radius: 50%; border: none;
            transition: background 0.2s;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav.prev { right: 12px; }
        .lightbox-nav.next { left: 12px; }
        .lightbox-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(44,24,16,0.95), transparent);
            padding: 32px 20px 40px;
            color: #f5f0e8;
        }
        .lightbox-info h3 {
            font-family: 'Amiri', serif;
            font-size: 22px; font-weight: 700;
            margin-bottom: 6px;
        }
        .lightbox-info p {
            font-size: 14px; color: #d4c9b8;
            line-height: 1.6;
        }
        .lightbox-counter {
            position: absolute; top: 20px; right: 20px;
            color: #d4c9b8; font-size: 13px; font-weight: 600;
            background: rgba(255,255,255,0.1);
            padding: 6px 14px; border-radius: 20px;
        }

        /* FAB */
        .fab-container {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 50;
        }
        .fab-btn {
            background: #2c1810;
            color: #f5f0e8;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700; font-size: 14px;
            border: 2px solid #d4c9b8;
            box-shadow: 0 4px 20px rgba(44,24,16,0.3);
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
            font-family: 'Cairo', sans-serif;
        }
        .fab-btn:hover {
            background: #4a3020;
            transform: translateX(-50%) scale(1.03);
        }

        /* No results */
        .no-results {
            text-align: center; padding: 60px 20px;
            color: #8b7355;
        }
        .no-results i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        /* Footer */
        .site-footer {
            background: #2c1810;
            padding: 20px;
            text-align: center;
        }
        .site-footer p {
            color: #d4c9b8; font-size: 12px;
        }
        .site-footer .credit {
            color: #f5f0e8; font-weight: 700;
            font-size: 13px; margin-bottom: 4px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f0e8; }
        ::-webkit-scrollbar-thumb { background: #d4c9b8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8a99a; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="menu-btn" onclick="showMenu()"><i class="fas fa-bars"></i></button>
        <span class="site-name">أرشيف الشبطاب</span>
        <div class="w-10"></div>
    </div>

    <!-- Header -->
    <div class="archive-header">
        <h1 class="archive-title">مكتبة الصور الأرشيفية</h1>
        <p class="archive-subtitle">
            نحفظ مجموعة من الصور المرتبطة بتاريخ القرية<br>
            وحياة أهل الشبطاب.
        </p>
    </div>

    <!-- Search -->
    <div class="search-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث في الصور..." oninput="filterArchives()">
        </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs" id="categoryTabs">
        <button class="cat-tab active" data-category="" onclick="setCategoryFilter('')">الكل</button>
        <button class="cat-tab" data-category="children" onclick="setCategoryFilter('children')">الأطفال</button>
        <button class="cat-tab" data-category="events" onclick="setCategoryFilter('events')">المناسبات</button>
        <button class="cat-tab" data-category="achievements" onclick="setCategoryFilter('achievements')">الإنجازات</button>
        <button class="cat-tab" data-category="people" onclick="setCategoryFilter('people')">الشخصيات</button>
        <button class="cat-tab" data-category="houses" onclick="setCategoryFilter('houses')">المنازل العريقة</button>
        <button class="cat-tab" data-category="shops" onclick="setCategoryFilter('shops')">المحلات</button>
    </div>

    <!-- Photo Grid -->
    <div id="photoGrid" class="photo-grid">
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div>
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div>
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div>
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div>
    </div>

    <!-- Load More -->
    <div id="loadMoreSection" class="load-more-section hidden">
        <button id="loadMoreBtn" onclick="loadMore()" class="load-more-btn">
            <i class="fas fa-spinner fa-spin mr-2 hidden" id="loadMoreSpinner"></i>
            عرض المزيد من الصور
        </button>
    </div>

    <!-- No Results -->
    <div id="noResults" class="no-results hidden">
        <i class="fas fa-image"></i>
        <p class="text-lg font-bold mb-2">لا توجد نتائج</p>
        <p class="text-sm">جرب بحثاً مختلفاً</p>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="credit">إعداد: سليمان صلاح الدين محمد</p>
        <p>© 2026 أرشيف الشبطاب</p>
    </footer>

    <!-- FAB -->
    <div class="fab-container">
        <a href="add.html" class="fab-btn">
            <i class="fas fa-plus"></i>
            <span>أضف صورة</span>
        </a>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
        <span id="lightboxCounter" class="lightbox-counter">1 / 1</span>
        <button class="lightbox-nav prev" onclick="navigateLightbox(-1)"><i class="fas fa-chevron-right"></i></button>
        <button class="lightbox-nav next" onclick="navigateLightbox(1)"><i class="fas fa-chevron-left"></i></button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <h3 id="lightboxNames">الاسم</h3>
            <p id="lightboxDesc">الوصف</p>
            <p id="lightboxMeta" style="margin-top:8px;font-size:12px;color:#b8a99a;"></p>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs, startAfter } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
            authDomain: "phone-soug.firebaseapp.com",
            databaseURL: "https://phone-soug-default-rtdb.firebaseio.com",
            projectId: "phone-soug",
            storageBucket: "phone-soug.firebasestorage.app",
            messagingSenderId: "224588578227",
            appId: "1:224588578227:web:f3127dfbea31a77d521fc6",
            measurementId: "G-S87955B526"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        let allArchives = [];
        let filteredArchives = [];
        let currentCategory = '';
        let currentSearch = '';
        let currentLightboxIndex = 0;
        let lastDoc = null;
        let isLoading = false;
        const PAGE_SIZE = 20;

        const categoryLabels = {
            'children': 'الأطفال',
            'events': 'المناسبات',
            'achievements': 'الإنجازات',
            'people': 'الشخصيات',
            'houses': 'المنازل العريقة',
            'shops': 'المحلات'
        };

        // Lazy load images
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    img.onload = () => img.classList.add('loaded');
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '100px' });

        async function loadArchives() {
            try {
                const q = query(collection(db, 'archives'), orderBy('createdAt', 'desc'), limit(PAGE_SIZE));
                const snapshot = await getDocs(q);
                allArchives = [];
                snapshot.forEach(doc => { allArchives.push({ id: doc.id, ...doc.data() }); });
                if (allArchives.length > 0) lastDoc = snapshot.docs[snapshot.docs.length - 1];
                filterAndRender();
            } catch (e) { console.error(e); showError(); }
        }

        async function loadMore() {
            if (isLoading || !lastDoc) return;
            isLoading = true;
            document.getElementById('loadMoreSpinner').classList.remove('hidden');
            document.getElementById('loadMoreBtn').disabled = true;

            try {
                const q = query(collection(db, 'archives'), orderBy('createdAt', 'desc'), startAfter(lastDoc), limit(PAGE_SIZE));
                const snapshot = await getDocs(q);
                const newArchives = [];
                snapshot.forEach(doc => { newArchives.push({ id: doc.id, ...doc.data() }); });
                if (newArchives.length > 0) {
                    allArchives = [...allArchives, ...newArchives];
                    lastDoc = snapshot.docs[snapshot.docs.length - 1];
                } else {
                    lastDoc = null;
                }
                filterAndRender(true);
            } catch (e) { console.error(e); }

            isLoading = false;
            document.getElementById('loadMoreSpinner').classList.add('hidden');
            document.getElementById('loadMoreBtn').disabled = false;
        }

        function filterArchives() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
            filterAndRender();
        }

        function filterAndRender(append = false) {
            filteredArchives = allArchives.filter(a => {
                const matchesSearch = !currentSearch ||
                    (a.names || a.name || '').toLowerCase().includes(currentSearch) ||
                    (a.description || '').toLowerCase().includes(currentSearch);
                const matchesCategory = !currentCategory || a.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            if (filteredArchives.length === 0) {
                document.getElementById('photoGrid').innerHTML = '';
                document.getElementById('noResults').classList.remove('hidden');
                document.getElementById('loadMoreSection').classList.add('hidden');
                return;
            }

            document.getElementById('noResults').classList.add('hidden');
            renderGrid(filteredArchives, append);

            const hasMore = lastDoc != null;
            document.getElementById('loadMoreSection').classList.toggle('hidden', !hasMore);
        }

        function renderGrid(archives, append) {
            const grid = document.getElementById('photoGrid');
            if (!append) grid.innerHTML = '';

            archives.forEach(archive => {
                const image = archive.images && archive.images.length > 0
                    ? archive.images[0]
                    : (archive.mainImage || 'https://via.placeholder.com/400?text=No+Image');
                const catLabel = categoryLabels[archive.category] || '';
                const names = archive.names || archive.name || '';

                const div = document.createElement('div');
                div.className = 'photo-item';
                div.onclick = () => openLightbox(archive.id);
                div.innerHTML = `
                    <img data-src="${image}" alt="${names}" loading="lazy">
                    <div class="photo-info">
                        ${catLabel ? `<div class="cat-label">${catLabel}</div>` : ''}
                        ${names ? `<div class="names">${names}</div>` : ''}
                    </div>
                `;
                grid.appendChild(div);

                const img = div.querySelector('img');
                imageObserver.observe(img);
            });
        }

        window.setCategoryFilter = function(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            filterAndRender();
        };

        window.loadMore = loadMore;

        // Lightbox
        window.openLightbox = function(archiveId) {
            const archive = filteredArchives.find(a => a.id === archiveId);
            if (!archive) return;
            currentLightboxIndex = filteredArchives.findIndex(a => a.id === archiveId);
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        function updateLightbox() {
            const archive = filteredArchives[currentLightboxIndex];
            if (!archive) return;

            const image = archive.images && archive.images.length > 0
                ? archive.images[0]
                : (archive.mainImage || '');

            document.getElementById('lightboxImg').src = image;
            document.getElementById('lightboxCounter').textContent = (currentLightboxIndex + 1) + ' / ' + filteredArchives.length;
            document.getElementById('lightboxNames').textContent = archive.names || archive.name || '';
            document.getElementById('lightboxDesc').textContent = archive.description || '';

            const catLabel = categoryLabels[archive.category] || '';
            const date = archive.eventDate
                ? new Date(archive.eventDate).toLocaleDateString('ar-SD')
                : (archive.createdAt ? new Date(archive.createdAt).toLocaleDateString('ar-SD') : '');
            const uploader = archive.uploaderName || archive.userName || '';
            let meta = [];
            if (catLabel) meta.push(catLabel);
            if (date) meta.push(date);
            if (uploader) meta.push(uploader);
            document.getElementById('lightboxMeta').textContent = meta.join(' • ');
        }

        window.navigateLightbox = function(dir) {
            currentLightboxIndex = (currentLightboxIndex + dir + filteredArchives.length) % filteredArchives.length;
            updateLightbox();
        };

        window.closeLightbox = function(e) {
            if (e && e.target !== e.currentTarget && e.target !== document.getElementById('lightboxImg')) return;
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        };

        window.showMenu = function() {
            alert('أرشيف الشبطاب\n\nنحفظ ذكرياتنا وتاريخنا للأجيال القادمة\n\nإعداد: سليمان صلاح الدين محمد');
        };

        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') navigateLightbox(-1);
            if (e.key === 'ArrowLeft') navigateLightbox(1);
        });

        function showError() {
            document.getElementById('photoGrid').innerHTML = `
                <div class="col-span-2 text-center py-12" style="color:#8b7355;">
                    <i class="fas fa-exclamation-circle text-3xl mb-3"></i>
                    <p>خطأ في تحميل الصور</p>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadArchives();
        });
    </script>
</body>
</html>
