<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أرشيف الشبطاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { background: #0f172a; overflow-x: hidden; }

        /* Header */
        .header-banner {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            position: relative; overflow: hidden;
        }
        .header-shape {
            position: absolute; border-radius: 50%; opacity: 0.05; background: white;
        }

        /* Search bar */
        .search-bar {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-bar input {
            background: transparent; color: white;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.5); }

        /* Photo Grid - 3 columns */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }
        @media (min-width: 768px) {
            .photo-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px; }
        }
        @media (min-width: 1024px) {
            .photo-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 8px; }
        }

        /* Photo Item */
        .photo-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            background: #1e293b;
            border-radius: 4px;
        }
        .photo-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .photo-item img.loaded { opacity: 1; }
        .photo-item:hover img { transform: scale(1.08); }
        .photo-item:hover .photo-overlay { opacity: 1; }

        .photo-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 8px;
        }
        .photo-overlay .names {
            color: white; font-size: 11px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .photo-overlay .category-badge {
            font-size: 9px; font-weight: 700; padding: 2px 6px;
            border-radius: 4px; display: inline-block; width: fit-content; margin-bottom: 4px;
        }
        .cat-children { background: #f59e0b; color: white; }
        .cat-events { background: #ec4899; color: white; }
        .cat-achievements { background: #22c55e; color: white; }
        .cat-people { background: #3b82f6; color: white; }
        .cat-houses { background: #8b5cf6; color: white; }
        .cat-shops { background: #06b6d4; color: white; }

        /* Skeleton loading */
        .skeleton-photo {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            aspect-ratio: 1;
            border-radius: 4px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Load more */
        .load-more-btn {
            background: linear-gradient(135deg, #1e3a5f, #3d7ab5);
            color: white; padding: 12px 32px;
            border-radius: 24px; font-weight: 800; font-size: 14px;
            border: none; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(30,58,95,0.4);
        }
        .load-more-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(30,58,95,0.5); }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img {
            max-width: 95vw; max-height: 85vh;
            object-fit: contain; border-radius: 8px;
        }
        .lightbox-close {
            position: absolute; top: 16px; left: 16px;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav.prev { right: 16px; }
        .lightbox-nav.next { left: 16px; }
        .lightbox-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 24px 16px 32px;
            color: white;
        }
        .lightbox-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .lightbox-info p { font-size: 13px; color: rgba(255,255,255,0.7); }
        .lightbox-counter {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 700; color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* FAB */
        .fab-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50; }
        .fab-btn {
            background: linear-gradient(135deg, #1e3a5f, #3d7ab5);
            box-shadow: 0 8px 32px rgba(30, 58, 95, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fab-btn:hover { transform: scale(1.05); }
        .fab-btn:active { transform: scale(0.95); }

        /* Category filter pills */
        .filter-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
            white-space: nowrap; cursor: pointer; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
        }
        .filter-pill:hover { background: rgba(255,255,255,0.1); color: white; }
        .filter-pill.active {
            background: linear-gradient(135deg, #1e3a5f, #3d7ab5);
            color: white; border-color: transparent;
            box-shadow: 0 4px 12px rgba(30,58,95,0.4);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* No results */
        .no-results { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); }
        .no-results i { font-size: 48px; margin-bottom: 16px; }

        /* Footer */
        .site-footer {
            background: #0a0f1d; padding: 24px 0 80px;
            text-align: center; border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <div class="header-banner text-white py-4 px-4">
        <div class="header-shape" style="width:200px;height:200px;top:-50px;right:-50px;"></div>
        <div class="header-shape" style="width:150px;height:150px;bottom:-30px;left:-30px;"></div>
        <div class="max-w-6xl mx-auto relative z-10">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur border border-white/20">
                        <i class="fas fa-landmark text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black leading-tight">أرشيف الشبطاب</h1>
                        <p class="text-[10px] text-white/50">ذاكرة القرية الرقمية</p>
                    </div>
                </div>
                <span id="totalCount" class="text-xs font-bold text-white/40 bg-white/5 px-3 py-1 rounded-full">0 صورة</span>
            </div>

            <!-- Search -->
            <div class="search-bar rounded-xl px-4 py-2.5 flex items-center gap-3 mb-3">
                <i class="fas fa-search text-white/40 text-sm"></i>
                <input type="text" id="searchInput" placeholder="ابحث بالاسم أو المناسبة..."
                    class="flex-1 text-sm outline-none bg-transparent" oninput="filterArchives()">
            </div>

            <!-- Category Filters -->
            <div class="flex gap-2 overflow-x-auto pb-1" id="categoryFilters" style="scrollbar-width:none;">
                <button onclick="setCategoryFilter('')" class="filter-pill active" data-category="">الكل</button>
                <button onclick="setCategoryFilter('children')" class="filter-pill" data-category="children">👶 الأطفال</button>
                <button onclick="setCategoryFilter('events')" class="filter-pill" data-category="events">🎉 المناسبات</button>
                <button onclick="setCategoryFilter('achievements')" class="filter-pill" data-category="achievements">🏆 الإنجازات</button>
                <button onclick="setCategoryFilter('people')" class="filter-pill" data-category="people">👤 الشخصيات</button>
                <button onclick="setCategoryFilter('houses')" class="filter-pill" data-category="houses">🏠 المنازل</button>
                <button onclick="setCategoryFilter('shops')" class="filter-pill" data-category="shops">🏪 المحلات</button>
            </div>
        </div>
    </div>

    <!-- Photo Grid -->
    <div id="photoGrid" class="photo-grid max-w-6xl mx-auto">
        <!-- Skeletons -->
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div><div class="skeleton-photo"></div>
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div><div class="skeleton-photo"></div>
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div><div class="skeleton-photo"></div>
        <div class="skeleton-photo"></div><div class="skeleton-photo"></div><div class="skeleton-photo"></div>
    </div>

    <!-- Load More -->
    <div id="loadMoreContainer" class="text-center py-6 hidden">
        <button id="loadMoreBtn" onclick="loadMore()" class="load-more-btn">
            <i class="fas fa-spinner fa-spin mr-2 hidden" id="loadMoreSpinner"></i>
            عرض المزيد
        </button>
    </div>

    <!-- No Results -->
    <div id="noResults" class="no-results hidden">
        <i class="fas fa-image"></i>
        <p class="text-lg font-bold mb-2">لا توجد نتائج</p>
        <p class="text-sm">جرب بحثاً مختلفاً</p>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="text-white/60 font-bold text-sm">إعداد: سليمان صلاح الدين محمد</p>
        <p class="text-white/30 text-[10px] mt-1">© 2026 أرشيف الشبطاب</p>
    </footer>

    <!-- FAB -->
    <div class="fab-container">
        <a href="add.html" class="fab-btn flex items-center gap-2 px-6 py-3 rounded-full text-white font-bold text-sm">
            <i class="fas fa-plus"></i>
            <span>أضف صورة</span>
        </a>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
        <span id="lightboxCounter" class="lightbox-counter">1 / 1</span>
        <button class="lightbox-nav prev" onclick="navigateLightbox(-1)"><i class="fas fa-chevron-right"></i></button>
        <button class="lightbox-nav next" onclick="navigateLightbox(1)"><i class="fas fa-chevron-left"></i></button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <span id="lightboxCategory" class="category-badge mb-2">تصنيف</span>
            <h3 id="lightboxNames">الاسم</h3>
            <p id="lightboxDesc">الوصف</p>
            <p id="lightboxMeta" class="text-xs text-white/40 mt-2"></p>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, getDocs, startAfter } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
            authDomain: "phone-soug.firebaseapp.com",
            databaseURL: "https://phone-soug-default-rtdb.firebaseio.com",
            projectId: "phone-soug",
            storageBucket: "phone-soug.firebasestorage.app",
            messagingSenderId: "224588578227",
            appId: "1:224588578227:web:f3127dfbea31a77d521fc6",
            measurementId: "G-S87955B526"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        let allArchives = [];
        let displayedArchives = [];
        let currentCategory = '';
        let currentSearch = '';
        let currentLightboxIndex = 0;
        let filteredArchives = [];
        let lastDoc = null;
        let isLoading = false;
        const PAGE_SIZE = 24;

        const categoryConfig = {
            'children': { label: 'أطفال', class: 'cat-children' },
            'events': { label: 'مناسبة', class: 'cat-events' },
            'achievements': { label: 'إنجاز', class: 'cat-achievements' },
            'people': { label: 'شخصية', class: 'cat-people' },
            'houses': { label: 'منزل', class: 'cat-houses' },
            'shops': { label: 'محل', class: 'cat-shops' }
        };

        // Lazy load images
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    img.onload = () => img.classList.add('loaded');
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '50px' });

        async function loadArchives() {
            try {
                const q = query(collection(db, 'archives'), orderBy('createdAt', 'desc'), limit(PAGE_SIZE));
                const snapshot = await getDocs(q);
                allArchives = [];
                snapshot.forEach(doc => { allArchives.push({ id: doc.id, ...doc.data() }); });
                if (allArchives.length > 0) lastDoc = snapshot.docs[snapshot.docs.length - 1];
                filterAndRender();
            } catch (e) { console.error(e); showError(); }
        }

        async function loadMore() {
            if (isLoading || !lastDoc) return;
            isLoading = true;
            document.getElementById('loadMoreSpinner').classList.remove('hidden');
            document.getElementById('loadMoreBtn').disabled = true;

            try {
                const q = query(collection(db, 'archives'), orderBy('createdAt', 'desc'), startAfter(lastDoc), limit(PAGE_SIZE));
                const snapshot = await getDocs(q);
                const newArchives = [];
                snapshot.forEach(doc => { newArchives.push({ id: doc.id, ...doc.data() }); });
                if (newArchives.length > 0) {
                    allArchives = [...allArchives, ...newArchives];
                    lastDoc = snapshot.docs[snapshot.docs.length - 1];
                }
                filterAndRender(true);
            } catch (e) { console.error(e); }

            isLoading = false;
            document.getElementById('loadMoreSpinner').classList.add('hidden');
            document.getElementById('loadMoreBtn').disabled = false;
        }

        function filterArchives() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
            filterAndRender();
        }

        function filterAndRender(append = false) {
            filteredArchives = allArchives.filter(a => {
                const matchesSearch = !currentSearch ||
                    (a.names || a.name || '').toLowerCase().includes(currentSearch) ||
                    (a.description || '').toLowerCase().includes(currentSearch);
                const matchesCategory = !currentCategory || a.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            document.getElementById('totalCount').textContent = filteredArchives.length + ' صورة';

            if (filteredArchives.length === 0) {
                document.getElementById('photoGrid').innerHTML = '';
                document.getElementById('noResults').classList.remove('hidden');
                document.getElementById('loadMoreContainer').classList.add('hidden');
                return;
            }

            document.getElementById('noResults').classList.add('hidden');
            renderGrid(filteredArchives, append);

            // Show load more if we have more in allArchives than filtered
            const hasMore = allArchives.length >= PAGE_SIZE && lastDoc != null;
            document.getElementById('loadMoreContainer').classList.toggle('hidden', !hasMore);
        }

        function renderGrid(archives, append) {
            const grid = document.getElementById('photoGrid');
            if (!append) grid.innerHTML = '';

            archives.forEach((archive, idx) => {
                const image = archive.images && archive.images.length > 0
                    ? archive.images[0]
                    : (archive.mainImage || 'https://via.placeholder.com/400?text=No+Image');
                const cat = categoryConfig[archive.category] || { label: '', class: '' };
                const names = archive.names || archive.name || '';

                const div = document.createElement('div');
                div.className = 'photo-item';
                div.onclick = () => openLightbox(archive.id);
                div.innerHTML = `
                    <img data-src="${image}" alt="${names}" loading="lazy">
                    <div class="photo-overlay">
                        ${cat.label ? `<span class="category-badge ${cat.class}">${cat.label}</span>` : ''}
                        ${names ? `<span class="names">${names}</span>` : ''}
                    </div>
                `;
                grid.appendChild(div);

                // Observe for lazy loading
                const img = div.querySelector('img');
                imageObserver.observe(img);
            });
        }

        window.setCategoryFilter = function(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            filterAndRender();
        };

        window.loadMore = loadMore;

        // Lightbox
        window.openLightbox = function(archiveId) {
            const archive = filteredArchives.find(a => a.id === archiveId);
            if (!archive) return;
            currentLightboxIndex = filteredArchives.findIndex(a => a.id === archiveId);
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        function updateLightbox() {
            const archive = filteredArchives[currentLightboxIndex];
            if (!archive) return;

            const image = archive.images && archive.images.length > 0
                ? archive.images[0]
                : (archive.mainImage || '');
            const cat = categoryConfig[archive.category] || { label: '', class: '' };

            document.getElementById('lightboxImg').src = image;
            document.getElementById('lightboxCounter').textContent = (currentLightboxIndex + 1) + ' / ' + filteredArchives.length;
            document.getElementById('lightboxNames').textContent = archive.names || archive.name || '';
            document.getElementById('lightboxDesc').textContent = archive.description || '';

            const catBadge = document.getElementById('lightboxCategory');
            catBadge.textContent = cat.label;
            catBadge.className = 'category-badge mb-2 ' + cat.class;

            const date = archive.eventDate
                ? new Date(archive.eventDate).toLocaleDateString('ar-SD')
                : (archive.createdAt ? new Date(archive.createdAt).toLocaleDateString('ar-SD') : '');
            const uploader = archive.uploaderName || archive.userName || 'زائر';
            document.getElementById('lightboxMeta').textContent = (date ? date + ' • ' : '') + uploader;
        }

        window.navigateLightbox = function(dir) {
            currentLightboxIndex = (currentLightboxIndex + dir + filteredArchives.length) % filteredArchives.length;
            updateLightbox();
        };

        window.closeLightbox = function(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        };

        // Keyboard nav
        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') navigateLightbox(-1);
            if (e.key === 'ArrowLeft') navigateLightbox(1);
        });

        // Infinite scroll
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !isLoading) loadMore();
            });
        }, { rootMargin: '200px' });

        function showError() {
            document.getElementById('photoGrid').innerHTML = `
                <div class="col-span-3 text-center py-12 text-white/40">
                    <i class="fas fa-exclamation-circle text-3xl mb-3"></i>
                    <p>خطأ في تحميل الصور</p>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadArchives();
            // Observe load more button for infinite scroll
            scrollObserver.observe(document.getElementById('loadMoreBtn'));
        });
    </script>
</body>
</html>
