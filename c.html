<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال رقم الهاتف - Realtime Database</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #2e7d32;
            margin-bottom: 20px;
            font-size: 24px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            text-align: left;
            direction: ltr;
        }
        input[type="tel"]:focus {
            border-color: #2e7d32;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .link-btn {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 14px;
        }
        .link-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>فحص الـ Realtime Database</h2>
    <p>أدخل رقم هاتف للتجربة وافحص وصوله الفوري</p>
    
    <form id="phoneForm">
        <div class="form-group">
            <label for="phoneNumber">رقم الهاتف:</label>
            <input type="tel" id="phoneNumber" placeholder="+249 000 000 000" required>
        </div>
        <button type="submit" id="submitBtn">إرسال الرقم الآن</button>
    </form>

    <a href="receive.html" class="link-btn">الانتقال لصفحة استلام الأرقام ←</a>
</div>

<script type="module">
    // استيراد المكتبات الخاصة بالـ Realtime Database
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // المفاتيح الحقيقية الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
        authDomain: "phone-soug.firebaseapp.com",
        databaseURL: "https://phone-soug-default-rtdb.firebaseio.com",
        projectId: "phone-soug",
        storageBucket: "phone-soug.firebasestorage.app",
        messagingSenderId: "224588578227",
        appId: "1:224588578227:web:46b4cb96ff2535a1521fc6",
        measurementId: "G-T3DSBNJ5MQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app); // تهيئة قاعدة البيانات الفورية

    document.getElementById("phoneForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById("submitBtn");
        const phoneNumber = document.getElementById("phoneNumber").value;

        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        try {
            // إرسال البيانات إلى مسار يدعى test_numbers في الـ Realtime Database
            await push(ref(db, 'test_numbers'), {
                phone: phoneNumber,
                createdAt: ServerValue ? ServerValue.TIMESTAMP : new Date().toISOString()
            });
            
            alert("✅ رائع! تم حفظ الرقم بنجاح في الـ Realtime Database.");
            document.getElementById("phoneForm").reset();
        } catch (error) {
            console.error("خطأ أثناء الإرسال: ", error);
            alert("❌ فشل الإرسال! تحقق من فتح الـ Rules في قسم Realtime Database.");
        } finally {
            btn.innerText = "إرسال الرقم الآن";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
