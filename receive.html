<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأرقام المستلمة - Cloud Firestore</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #0288d1;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }
        .sub-title {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        .list-container {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-left: 0;
        }
        .number-item {
            background-color: #f9f9f9;
            padding: 12px 15px;
            border-right: 4px solid #0288d1;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: ltr;
        }
        .number-item span {
            color: #333;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0288d1;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>شاشة استعراض البيانات</h2>
    <div class="sub-title">الأرقام المخزنة حالياً في Cloud Firestore</div>
    
    <ul id="numbersList" class="list-container">
        <div class="no-data">جاري جلب البيانات من Cloud Firestore...</div>
    </ul>

    <a href="send.html" class="back-btn">← العودة لصفحة الإرسال</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARzFwq6D3QI5xanevX_OLb0xQl-r_Fm8c",
      authDomain: "phone-soug.firebaseapp.com",
      databaseURL: "https://phone-soug-default-rtdb.firebaseio.com",
      projectId: "phone-soug",
      storageBucket: "phone-soug.firebasestorage.app",
      messagingSenderId: "224588578227",
      appId: "1:224588578227:web:46b4cb96ff2535a1521fc6",
      measurementId: "G-T3DSBNJ5MQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchNumbers() {
        const listElement = document.getElementById("numbersList");
        
        try {
            // جلب الأرقام من كولكشن الكلاود فايرستور
            const q = query(collection(db, "test_numbers"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            listElement.innerHTML = ""; 
            
            if (querySnapshot.empty) {
                listElement.innerHTML = '<div class="no-data">لا توجد أرقام مسجلة حتى الآن.</div>';
                return;
            }
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement("li");
                li.className = "number-item";
                li.innerHTML = `<span>📱</span> ${data.phone}`;
                listElement.appendChild(li);
            });
            
        } catch (error) {
            console.error("خطأ أثناء جلب البيانات: ", error);
            listElement.innerHTML = '<div class="no-data" style="color: red;">فشل جلب البيانات. تأكد من إعدادات الـ Rules في الكلاود!</div>';
        }
    }

    fetchNumbers();
</script>

</body>
</html>
